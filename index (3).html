<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подход — дневник тренировок</title>
<meta name="theme-color" content="#15181E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Подход">
<meta name="description" content="Дневник тренировок: шаблоны, подходы, таймер отдыха, прогресс, вода и добавки">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23D7263D'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%2315181E'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEE;--surface:#FFFFFF;--surface2:#F2F4F6;--ink:#15181E;--muted:#5D6572;--line:#D3D8DE;
  --red:#D7263D;--blue:#1F5FBF;--yellow:#D99A00;--green:#1F8F55;--violet:#7A4FD6;--teal:#0E8F8E;
  --done:rgba(31,143,85,.10);--shadow:0 1px 0 rgba(21,24,30,.06);
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--surface:#171B21;--surface2:#1F242C;--ink:#ECEFF3;--muted:#98A1AD;--line:#2A3039;
  --red:#FF4D5E;--blue:#5C95FF;--yellow:#FFC23D;--green:#3CC47C;--violet:#A58BFF;--teal:#34C9C7;
  --done:rgba(60,196,124,.12);--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0F1216;--surface:#171B21;--surface2:#1F242C;--ink:#ECEFF3;--muted:#98A1AD;--line:#2A3039;
  --red:#FF4D5E;--blue:#5C95FF;--yellow:#FFC23D;--green:#3CC47C;--violet:#A58BFF;--teal:#34C9C7;
  --done:rgba(60,196,124,.12);--shadow:none;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0;font-weight:700}
.disp{font-family:var(--display);letter-spacing:-.01em}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--red);box-shadow:inset 0 0 0 5px var(--red),inset 0 0 0 8px var(--surface);display:inline-block}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h2{font-size:18px}
.link{color:var(--blue);font-weight:600;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--red)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px}
.input:focus{outline:2px solid var(--blue);outline-offset:-1px}

/* start hero */
.start{display:block;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:20px;padding:22px 20px;position:relative;overflow:hidden}
.start b{font-family:var(--display);font-size:24px;font-weight:800;display:block;line-height:1.15}
.start span{opacity:.7;font-size:14px}
.start svg{position:absolute;right:-28px;top:50%;transform:translateY(-50%);width:150px;height:150px;opacity:.95}
.live{background:var(--red);color:#fff}
.live span{display:block}
.live .t{opacity:1;font-family:var(--display);font-size:32px;font-weight:700;display:block;margin:4px 0}

/* week plates */
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.plate{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.plate.on{background:var(--red);border-color:var(--red);box-shadow:inset 0 0 0 6px var(--red),inset 0 0 0 9px rgba(255,255,255,.35)}
.plate.today{border-color:var(--ink)}
.weekline{margin-top:10px;font-size:14px;color:var(--muted)}

/* templates */
.tpl{display:flex;gap:12px;align-items:center;padding:14px 16px}
.tpl+.tpl{border-top:1px solid var(--line)}
.tpl h3{font-size:16px}
.tpl p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.empty{padding:22px 18px;text-align:left}
.empty p{margin:0 0 14px;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left}
.tool b{display:block;font-size:15px}
.tool span{font-size:13px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--red)}

/* history */
.month{font-size:14px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.hist{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px}
.hist+.hist{border-top:1px solid var(--line)}
.dnum{width:46px;text-align:center;flex:none}
.dnum b{font-family:var(--display);font-size:20px;display:block;line-height:1}
.dnum span{font-size:12px;color:var(--muted)}
.hist h3{font-size:16px}
.hist p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pr-badge{display:inline-block;background:var(--yellow);color:#1b1400;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.stat b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.bars .b{display:grid;grid-template-columns:72px 1fr 34px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.bars .track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bars .fill{height:100%;border-radius:99px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rec{background:var(--surface2);border-radius:12px;padding:10px 12px}
.rec b{font-family:var(--display);font-size:17px;display:block}
.rec span{font-size:12.5px;color:var(--muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* library */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px}
.exi+.exi{border-top:1px solid var(--line)}
.gdot{width:10px;height:10px;border-radius:50%;flex:none}
.exi .nm{font-weight:500}
.exi .sub{font-size:12.5px;color:var(--muted)}
.pick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto;display:grid;place-items:center;font-size:12px;font-weight:700}
.pick.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sheet-h h2{font-size:18px;flex:1}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;flex:1}
.sheet-f{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.acts button{display:block;width:100%;text-align:left;padding:14px 16px;font-weight:500}
.acts button+button{border-top:1px solid var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.tplex{display:flex;align-items:center;gap:8px;padding:10px 12px}
.tplex+.tplex{border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:8px;background:var(--surface2);font-weight:700}
.stepper input{width:38px;text-align:center;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mini svg{width:18px;height:18px}

/* workout */
.wo{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.wo-top{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.wo-top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.wo-name{flex:1;min-width:0;font-weight:700;font-size:17px;background:none;border:0;padding:6px 0;border-bottom:1px dashed transparent}
.wo-name:focus{outline:none;border-bottom-color:var(--line)}
.wo-meta{max-width:640px;margin:0 auto;padding:14px 16px 0;display:flex;gap:22px}
.wo-meta div b{font-family:var(--display);font-size:22px;display:block;line-height:1.1}
.wo-meta div span{font-size:12.5px;color:var(--muted)}
.wo-body{max-width:640px;margin:0 auto;padding:14px 16px 200px}
.exc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;margin-bottom:12px}
.exc-h{display:flex;align-items:center;gap:10px;padding:0 4px}
.exc-h h3{font-size:16px;flex:1}
.hint{font-size:13px;color:var(--muted);padding:4px 4px 0}
.hint b{color:var(--green);font-weight:600}
.sets{margin-top:10px}
.srow{display:grid;grid-template-columns:38px 1fr 70px 70px 44px;gap:8px;align-items:center;padding:5px 4px;border-radius:10px}
.srow.one{grid-template-columns:38px 1fr 148px 44px}
.srow.hd{font-size:12px;color:var(--muted);font-weight:500;padding-top:0;padding-bottom:2px}
.srow.hd span{text-align:center}
.srow.hd span:nth-child(2){text-align:left}
.srow.isdone{background:var(--done)}
.setn{height:32px;border-radius:8px;background:var(--surface2);font-weight:700;font-size:14px}
.setn.w{color:var(--yellow)}
.prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sin{width:100%;height:38px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:600;font-variant-numeric:tabular-nums;padding:0 4px}
.sin::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.isdone .sin{background:transparent;border-color:transparent}
.chk{width:44px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;border:1px solid var(--line)}
.chk svg{width:20px;height:20px;opacity:.35}
.isdone .chk{background:var(--green);border-color:var(--green);color:#fff}
.isdone .chk svg{opacity:1}
.prmark{color:var(--yellow);font-size:11px;font-weight:700}
.addset{display:block;width:100%;height:38px;margin-top:6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);background:var(--surface2)}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.rest-in{pointer-events:auto;max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.rest.lift{bottom:58px}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;opacity:.6}
.rest-in>button.grow{color:inherit;min-width:0}
.rest-in .rest-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-t{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.rest-l{font-size:12.5px;opacity:.7}
.rbtn{height:38px;min-width:46px;padding:0 10px;border-radius:10px;background:rgba(127,127,127,.22);font-weight:600;font-size:14px}
.rest.over .rest-in{background:var(--green);color:#fff}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.gold{background:var(--yellow);color:#1b1400}

/* plates calc */
.barviz{display:flex;align-items:center;justify-content:center;gap:2px;height:120px;margin:14px 0;overflow-x:auto}
.bar-rod{height:10px;width:60px;background:var(--muted);border-radius:3px}
.bar-sleeve{height:16px;width:14px;background:var(--muted);border-radius:2px}
.pl{border-radius:4px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;writing-mode:vertical-rl}
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable td{padding:8px 4px;border-bottom:1px solid var(--line)}
.ptable td:last-child{text-align:right;font-weight:600}
.big{font-family:var(--display);font-size:36px;font-weight:800;line-height:1.1}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}
.sw.on::after{left:21px}
@media (max-width:380px){.srow{grid-template-columns:32px 1fr 62px 62px 40px;gap:6px}.srow.one{grid-template-columns:32px 1fr 124px 40px}.stats b{font-size:19px}}

/* ===== v2 look ===== */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:100;background:linear-gradient(90deg,var(--red) 0 25%,var(--blue) 25% 50%,var(--yellow) 50% 75%,var(--green) 75%)}
.wrap{padding-bottom:160px}
.hello{font-size:14px;color:var(--muted);margin:-8px 0 12px;font-weight:500}
.tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:620px;margin:0 auto}
.tabs-in{grid-template-columns:repeat(5,1fr)}
.tab{height:60px;font-size:10.5px;position:relative}
.tab svg{position:relative;z-index:1}
.tab.on::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:30px;border-radius:12px;background:color-mix(in srgb,var(--red) 15%,transparent)}
.rest.lift{bottom:72px}
.btn,.chk,.tool,.chip,.cup,.supp,.setn,.tw,.calc{transition:transform .12s ease}
.btn:active,.chk:active,.tool:active,.chip:active,.cup:active,.supp:active,.setn:active,.tw:active{transform:scale(.96)}
.start svg{transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.start:active svg{transform:translateY(-50%) rotate(60deg)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.chk.pop{animation:pop .32s ease-out}
.exc{border-left:4px solid var(--gc,var(--line))}
.note{margin:6px 4px 0;font-size:13px;background:color-mix(in srgb,var(--yellow) 16%,transparent);border-radius:8px;padding:5px 9px}
.srow{transition:transform .15s,background .15s;touch-action:pan-y}
.srow.swiping{transition:none}
.tundo{margin-left:10px;color:inherit;font-weight:700;text-decoration:underline}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
/* today widget */
.todayw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0}
.tw b{display:block;font-family:var(--display);font-size:15px;line-height:1.2;white-space:nowrap}
.tw span{font-size:12px;color:var(--muted)}
.tw .plus{margin-left:auto;width:36px;height:36px;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;flex:none}
.miniring{width:44px;height:44px;flex:none;transform:rotate(-90deg)}
.ringbtn{position:relative;width:44px;height:44px;flex:none}
.ringbtn span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--blue)}
.ringbtn:active{transform:scale(.9)}
.tw span{display:block}
/* habits */
.daynav{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.daynav b{flex:1;text-align:center;font-weight:600}
.water-top{display:flex;gap:18px;align-items:center}
.bottle{width:110px;flex:none}
.bottle .wlevel{transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.wave{animation:wave 2.6s linear infinite}
.wave.b{animation-duration:3.8s;opacity:.45}
@keyframes wave{to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}.bottle .wlevel{transition:none}}
.ok{color:var(--green);font-weight:600;font-size:14px;margin-top:4px}
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}

async function upsertDoc(doc_id,data){const {error}=await sb.from('user_docs').upsert({user_id:uid,doc_id,data},{onConflict:'user_id,doc_id'});if(error)throw error}
const writers=[];
function makeWriter(docId,getter,delay){
  let t,running=false,dirty=false;
  async function run(){
    if(!uid)return;
    if(running){dirty=true;return}
    running=true;
    do{dirty=false;try{await upsertDoc(docId,getter());w.failed=false}catch(e){w.failed=true;console.warn('save',docId,e)}}while(dirty&&!w.failed);
    running=false;refreshSync();
  }
  const w=()=>{if(!uid)return;clearTimeout(t);w.sched=true;setSync('saving');t=setTimeout(()=>{w.sched=false;run()},delay)};
  w.busy=()=>running||w.sched||w.failed;
  w.flush=()=>{clearTimeout(t);w.sched=false;return run()};
  writers.push(w);return w;
}
function setSync(st){syncState=st;const el=document.getElementById('syncLbl');if(el)el.innerHTML=syncLabel()}
function refreshSync(){setSync(writers.some(w=>w.failed)||outboxFailed?'offline':(writers.some(w=>w.busy())||outbox().length)?'saving':'cloud')}
function syncLabel(){

/* outbox for workouts: survives reloads and offline */

function queue(op,id){if(!uid)return;const o=outbox().filter(x=>x.id!==id);o.push({op,id});lsSet('outbox',o);flushOutbox()}
async function flushOutbox(){
  if(!uid||flushing)return;flushing=true;setSync('saving');
  try{
    let o=outbox();
    while(o.length){const it=o[0];
      if(it.op==='put'){const w=history.find(x=>x.id===it.id);if(w)await upsertDoc('w_'+w.id,clone(w))}
      else{const {error}=await sb.from('user_docs').delete().eq('user_id',uid).eq('doc_id','w_'+it.id);if(error)throw error}
      o=outbox().filter(x=>!(x.id===it.id&&x.op===it.op));lsSet('outbox',o)}
    outboxFailed=false;
  }catch(e){outboxFailed=true;console.warn('outbox',e)}
  flushing=false;refreshSync();
}

async function pullCloud(first){
  const {data,error}=await sb.from('user_docs').select('doc_id,data').limit(10000);
  if(error)throw error;
  let rState=null,rHab=null,rActive=null,rW=[];
  data.forEach(r=>{const v=r.data;if(!v)return;
    if(r.doc_id==='state')rState=v;else if(r.doc_id==='habits')rHab=v;else if(r.doc_id==='active')rActive=v;else if(r.doc_id.startsWith('w_'))rW.push(v)});
  if(rState)state={...state,...rState,settings:{...DEF_SETTINGS,...(rState.settings||{})}};
  else if(first&&(state.templates.length||state.custom.length||state.body.length))pushState();
  if(rHab)habits=mergeHab(rHab);
  else if(first&&(habits.supps.length||Object.keys(habits.water.days).length))pushHabits();
  const ob=outbox(),pPut=new Set(ob.filter(o=>o.op==='put').map(o=>o.id)),pDel=new Set(ob.filter(o=>o.op==='del').map(o=>o.id));
  const ids=new Set(rW.map(w=>w.id));
  const keep=history.filter(w=>!ids.has(w.id)&&(first||pPut.has(w.id)));
  history=[...rW.filter(w=>!pDel.has(w.id)),...keep];
  if(first)keep.forEach(w=>{const o=outbox().filter(x=>x.id!==w.id);o.push({op:'put',id:w.id});lsSet('outbox',o)});
  const rA=rActive&&rActive.w?rActive.w:null;
  if(first){if(!active&&rA)active=rA;else if(active)pushActive()}
  else if(!woOpen){active=rA}
  lsSet('state',state);saveHistory();lsSet('active',active);lsSet('habits',habits);
}

/* ===================== lookups ===================== */
const allEx=()=>[...EX,...state.custom];
const exById=id=>allEx().find(e=>e.id===id)||{id,n:'Упражнение',g:'cardio',t:'w'};
const isWork=s=>s.type!=='w';
function sessionsWith(exId,excludeId){
  return history.filter(w=>w.id!==excludeId).sort((a,b)=>b.start-a.start)
    .map(w=>({w,e:w.ex.find(x=>x.exId===exId)})).filter(x=>x.e&&x.e.sets.some(s=>s.done));
}
function prevSets(exId){const s=sessionsWith(exId,active&&active.id)[0];return s?s.e.sets.filter(x=>x.done):[]}
function setScore(t,s){ // main metric per set
  const a=num(s.a)||0,b=num(s.b)||0;
  if(t==='w')return e1rm(a,b);
  if(t==='bw')return b+a/1000; // reps first, extra weight breaks ties
  if(t==='t')return a;
  return b||a;
}
function bestEver(exId,excludeId){
  const t=exById(exId).t;let best=0;
  sessionsWith(exId,excludeId).forEach(({e})=>e.sets.forEach(s=>{if(s.done&&isWork(s))best=Math.max(best,setScore(t,s))}));
  return best;
}
function setText(t,s){
  const a=num(s.a),b=num(s.b);
  if(t==='w')return `${fmt(a)}×${fmt(b,0)}`;
  if(t==='bw')return a?`+${fmt(a)}×${fmt(b,0)}`:`${fmt(b,0)} повт`;
  if(t==='t')return `${fmt(a,0)} с`;
  return `${fmt(a,0)} мин${b?`, ${fmt(b)} км`:''}`;
}
function workoutStats(w){
  let vol=0,sets=0,prs=0;
  w.ex.forEach(e=>{const t=exById(e.exId).t;e.sets.forEach(s=>{if(!s.done)return;sets++;if(s.pr)prs++;
    if(isWork(s)){if(t==='w')vol+=(num(s.a)||0)*(num(s.b)||0);if(t==='bw'&&num(s.a))vol+=num(s.a)*(num(s.b)||0)}})});
  return {vol,sets,prs,dur:(w.end||Date.now())-w.start};
}

function streak(){
  if(!history.length)return 0;
  const weeks=new Set(history.map(w=>weekStart(w.start)));
  let w=weekStart(Date.now()),n=0;
  if(!weeks.has(w))w-=7*86400000;
  while(weeks.has(w)){n++;w=weekStart(w-3*86400000)}
  return n;
}

/* ===================== progress ===================== */
function progressView(){
  if(!history.length)return `<h1 class="disp" style="font-size:26px">Прогресс</h1><div class="card empty" style="margin-top:14px"><p>После первой тренировки здесь появятся графики силовых, тоннаж по неделям, рекорды и распределение нагрузки по мышцам.</p><button class="btn pri" data-act="start-empty">Начать тренировку</button></div>${bodySection()}`;
  const ws=weekStart(Date.now()),wk=7*86400000;
  const volIn=(a,b)=>history.filter(w=>w.start>=a&&w.start<b).reduce((s,w)=>s+workoutStats(w).vol,0);
  const thisV=volIn(ws,ws+wk),lastV=volIn(ws-wk,ws);
  const diff=lastV?Math.round((thisV-lastV)/lastV*100):null;
  const stats=`<div class="stats" style="margin-top:14px">
    <div class="stat"><b class="num">${history.length}</b><span>всего тренировок</span></div>
    <div class="stat"><b class="num">${fmtTon(thisV)}</b><span>тоннаж за неделю${diff!=null?`, ${diff>=0?'+':''}${diff}%`:''}</span></div>
    <div class="stat"><b class="num">${streak()}</b><span>${plural(streak(),'неделя','недели','недель')} подряд</span></div></div>`;
  // weekly volume bars
  const N=10,vals=[],labels=[];
  for(let i=N-1;i>=0;i--){const a=ws-i*wk;vals.push(Math.round(volIn(a,a+wk)));labels.push(fmtDate(a).replace('.',''))}
  const weekly=`<div class="sec"><div class="sec-h"><h2>Тоннаж по неделям</h2></div><div class="card chart">${barChart(vals,labels,v=>fmtTon(v))}</div></div>`;
  // muscle groups 30d
  const since=Date.now()-30*86400000;const g={};
  history.filter(w=>w.start>=since).forEach(w=>w.ex.forEach(e=>{const n=e.sets.filter(s=>s.done&&isWork(s)).length;if(n){const k=exById(e.exId).g;g[k]=(g[k]||0)+n}}));
  const maxG=Math.max(1,...Object.values(g));
  const groups=`<div class="sec"><div class="sec-h"><h2>Рабочие подходы на мышцы</h2><span class="small muted" style="white-space:nowrap">30 дней</span></div><div class="card bars">
    ${Object.keys(GROUPS).filter(k=>k!=='cardio').map(k=>`<div class="b"><span>${GROUPS[k].n}</span><div class="track"><div class="fill" style="width:${(g[k]||0)/maxG*100}%;background:${GROUPS[k].c}"></div></div><span class="num" style="text-align:right">${g[k]||0}</span></div>`).join('')}
    <p class="small muted" style="margin:8px 0 0">Для роста мышц обычно советуют 10–20 рабочих подходов на группу в неделю.</p></div></div>`;
  // exercise progress
  const used=[...new Set(history.flatMap(w=>w.ex.filter(e=>e.sets.some(s=>s.done)).map(e=>e.exId)))];
  if(!progEx||!used.includes(progEx)){
    const counts={};history.forEach(w=>w.ex.forEach(e=>counts[e.exId]=(counts[e.exId]||0)+1));
    progEx=used.sort((a,b)=>(counts[b]||0)-(counts[a]||0))[0];
  }
  const exSec=`<div class="sec"><div class="sec-h"><h2>Силовые по упражнению</h2></div><div class="card">
    <select class="input" data-in="prog-ex">${used.map(id=>`<option value="${id}" ${id===progEx?'selected':''}>${esc(exById(id).n)}</option>`).join('')}</select>
    ${exProgress(progEx)}</div></div>`;
  return `<h1 class="disp" style="font-size:26px">Прогресс</h1>${stats}${exSec}${weekly}${groups}${bodySection()}`;
}
function exProgress(exId){
  const x=exById(exId);
  const sess=sessionsWith(exId).reverse();
  const pts=sess.map(({w,e})=>{const ws=e.sets.filter(s=>s.done&&isWork(s));
    if(x.t==='w')return {x:w.start,y:Math.max(0,...ws.map(s=>e1rm(num(s.a),num(s.b))))};
    if(x.t==='bw')return {x:w.start,y:Math.max(0,...ws.map(s=>num(s.b)||0))};
    if(x.t==='t')return {x:w.start,y:Math.max(0,...ws.map(s=>num(s.a)||0))};
    return {x:w.start,y:ws.reduce((t,s)=>t+(num(s.b)||num(s.a)||0),0)};}).filter(p=>p.y>0);
  const label={w:'Расчётный 1ПМ, кг',bw:'Лучший подход, повторений',t:'Лучшее время, сек',c:'За тренировку'}[x.t];
  let recs='';
  if(x.t==='w'){
    let best1=0,bestW=null,bestVol=0,maxReps=0;
    sess.forEach(({e})=>e.sets.forEach(s=>{if(!s.done||!isWork(s))return;const a=num(s.a)||0,b=num(s.b)||0;
      best1=Math.max(best1,e1rm(a,b));if(!bestW||a>bestW.a||(a===bestW.a&&b>bestW.b))bestW={a,b};bestVol=Math.max(bestVol,a*b);maxReps=Math.max(maxReps,b)}));

  }else{
    const best=Math.max(0,...pts.map(p=>p.y));
    recs=`<div class="recs"><div class="rec"><b class="num">${fmt(best)}</b><span>рекорд</span></div><div class="rec"><b class="num">${sess.length}</b><span>${plural(sess.length,'тренировка','тренировки','тренировок')}</span></div></div>`;
  }

function bodySection(){

function lineChart(pts,{color='var(--blue)'}={}){
  if(pts.length<2)return `<p class="small muted" style="margin:6px 0">График появится после двух записей.${pts.length?` Сейчас: ${fmt(pts[0].y)}.`:''}</p>`;
  const W=400,H=170,L=38,R=10,T=12,B=24;
  let mn=Math.min(...pts.map(p=>p.y)),mx=Math.max(...pts.map(p=>p.y));
  if(mx===mn){mx+=1;mn-=1}const padv=(mx-mn)*.12;mn-=padv;mx+=padv;
  const X=i=>L+(W-L-R)*(pts.length===1?0:i/(pts.length-1));
  const Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const grid=[0,.5,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(v,0)}</text>`}).join('');
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area=`${d}L${X(pts.length-1)},${H-B}L${L},${H-B}Z`;
  const showDots=pts.length<=30;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${grid}<path d="${area}" fill="${color}" opacity=".08"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${showDots?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3.2}" fill="${i===pts.length-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/>`).join(''):''}
   <text x="${L}" y="${H-8}" font-size="11" fill="var(--muted)">${fmtDate(pts[0].x)}</text><text x="${W-R}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(pts[pts.length-1].x)}</text></svg>`;
}
function barChart(vals,labels,f){
  const W=400,H=160,B=22,T=20,mx=Math.max(1,...vals),n=vals.length,bw=(W-10)/n;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${vals.map((v,i)=>{const h=(H-B-T)*v/mx,x=5+i*bw+bw*.18,y=H-B-h,last=i===n-1;
    return `<rect x="${x}" y="${v?y:H-B-2}" width="${bw*.64}" height="${v?h:2}" rx="4" fill="${last?'var(--red)':'var(--line)'}"/>
    ${v&&(last||v===mx)?`<text x="${x+bw*.32}" y="${y-6}" font-size="11" text-anchor="middle" fill="var(--ink)" font-weight="600">${f(v)}</text>`:''}
    <text x="${x+bw*.32}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--muted)">${i%2===(n-1)%2?labels[i]:''}</text>`}).join('')}</svg>`;
}

function toast(msg,gold,undo){const t=$('#toast');toast.undo=undo||null;t.innerHTML=`<div class="toast ${gold?'gold':''}">${esc(msg)}${undo?'<button class="tundo" data-act="toast-undo">Вернуть</button>':''}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.innerHTML='';toast.undo=null},undo?5000:2600)}
function confetti(n=90){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  const W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio,ctx=c.getContext('2d'),cs=getComputedStyle(document.documentElement);
  const cols=['--red','--blue','--yellow','--green','--violet'].map(v=>cs.getPropertyValue(v).trim()||'#f00');
  const P=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.022,vy:-Math.random()*H*.02-H*.006,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:(6+Math.random()*7)*devicePixelRatio,c:cols[Math.floor(Math.random()*cols.length)],round:Math.random()<.35}));
  const t0=performance.now();
  (function f(t){const dt=t-t0;ctx.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=H*.0006;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-dt/2200);ctx.fillStyle=p.c;
      if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(dt<2200)requestAnimationFrame(f);else c.remove()})(t0);
}

/* ===================== workout ===================== */
function newEntry(exId,sets=3,reps){
  const prev=prevSets(exId).filter(isWork);
  const n=Math.max(sets,prev.length&&!reps?Math.min(prev.length,6):sets);
  const ls=sessionsWith(exId,active&&active.id)[0];
  return {exId,reps:reps||null,note:ls&&ls.e.note?ls.e.note:'',sets:Array.from({length:n},()=>({a:'',b:'',done:false,type:'n'}))};
}
function startWorkout(tpl,fromHistory){
  if(active){toast('Сначала заверши текущую тренировку');showWorkout();return}
  active={id:gid(),name:tpl?tpl.name:(fromHistory?fromHistory.name:'Тренировка'),start:Date.now(),tplId:tpl?tpl.id:null,
    ex:tpl?tpl.ex.map(e=>newEntry(e.exId,e.sets,e.reps)):fromHistory?fromHistory.ex.map(e=>newEntry(e.exId,Math.max(1,e.sets.filter(s=>s.done&&isWork(s)).length),e.reps)):[]};
  if(!tpl&&!fromHistory){const h=new Date().getHours();active.name=h<12?'Утренняя тренировка':h<18?'Дневная тренировка':'Вечерняя тренировка'}
  saveActive();sheets.length=0;drawSheets();showWorkout();wake();
  if(!active.ex.length)setTimeout(()=>openPicker(addToActive),150);
}
function addToActive(ids){ids.forEach(id=>active.ex.push(newEntry(id)));saveActive();renderWorkout(true)}
let woOpen=false;
function showWorkout(){woOpen=true;$('#wo').className='wo';document.body.style.overflow='hidden';renderWorkout();renderRest()}
function hideWorkout(){woOpen=false;$('#wo').innerHTML='';$('#wo').className='';document.body.style.overflow='';render()}
function renderWorkoutIfOpen(){if(woOpen)renderWorkout(true)}
function placeholderFor(e,j){
  const prev=prevSets(e.exId).filter(isWork);let p=prev[j]||prev[prev.length-1];
  const above=e.sets.slice(0,j).filter(s=>s.done&&isWork(s)).pop();
  if(above&&e.sets[j].type!=='w')p=above;
  const sug=above?null:suggestion(e);
  return {a:sug?sug.a:(p?(num(p.a)??''):''),b:p?(num(p.b)??''):(e.reps||'')};
}
function suggestion(e){
  const x=exById(e.exId);if(x.t!=='w'||!e.reps)return null;
  const prev=prevSets(e.exId).filter(isWork);if(!prev.length)return null;
  if(prev.length>=e.sets.filter(isWork).length&&prev.every(s=>(num(s.b)||0)>=e.reps)){const top=Math.max(...prev.map(s=>num(s.a)||0));if(!top)return null;
    const inc=['legs','back'].includes(x.g)&&top>=40?5:2.5;return {a:top+inc,from:top}}
  return null;
}
function renderWorkout(keepScroll){
  if(!active){hideWorkout();return}
  const host=$('#wo');const sc=keepScroll&&host.firstElementChild?host.scrollTop:0;
  const st=workoutStats(active);
  host.innerHTML=`<div class="wo-top"><div class="wo-top-in">
      <button class="iconbtn" data-act="wo-min" aria-label="Свернуть">${ICON.down}</button>
      <input class="wo-name" data-in="wo-name" value="${esc(active.name)}" aria-label="Название тренировки">
      <button class="btn sm pri" data-act="wo-finish">Завершить</button></div></div>
    <div class="wo-meta"><div><b class="num" data-live="elapsed">${fmtDur(Date.now()-active.start)}</b><span>время</span></div>
      <div><b class="num">${st.vol?fmtTon(st.vol):'0 кг'}</b><span>тоннаж</span></div>
      <div><b class="num">${st.sets}</b><span>${plural(st.sets,'подход','подхода','подходов')}</span></div></div>
    <div class="wo-body">
      ${active.ex.map((e,i)=>exCard(e,i)).join('')}
      ${active.ex.length?'':'<div class="card empty"><p>Добавь первое упражнение. Можно выбрать сразу несколько, они встанут в том порядке, в котором ты их отметишь.</p></div>'}
      <button class="btn ink block" data-act="wo-add">Добавить упражнение</button>
      <button class="btn block danger" style="margin-top:10px;background:none;border:0" data-act="wo-cancel">Отменить тренировку</button>
    </div>`;
  host.scrollTop=sc;
}
function exCard(e,i){
  const x=exById(e.exId);const T=TYPES[x.t];const one=T.f.length===1;
  const prev=prevSets(e.exId);const prevW=prev.filter(isWork);
  const sug=suggestion(e);
  let hint='';
  if(prevW.length)hint=`В прошлый раз: ${prevW.map(s=>setText(x.t,s)).join(', ')}`;
  if(e.reps)hint=(hint?hint+'. ':'')+`Цель ${e.sets.length}×${e.reps}`;
  if(sug)hint+=`. <b>Всё выполнил — пробуй ${fmt(sug.a)} кг</b>`;
  let wn=0;
  return `<div class="exc" style="--gc:${GROUPS[x.g].c}"><div class="exc-h"><span class="gdot" style="background:${GROUPS[x.g].c}"></span><h3>${esc(x.n)}</h3>
     ${e.rest?`<span class="small muted">отдых ${e.rest} с</span>`:''}
     <button class="mini" data-act="ex-menu" data-i="${i}" aria-label="Действия">${ICON.dots}</button></div>
    ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
    ${hint?`<div class="hint">${hint}</div>`:''}
    <div class="sets"><div class="srow hd ${one?'one':''}"><span>№</span><span>Прошлый</span>${T.f.map(f=>`<span>${f}</span>`).join('')}<span></span></div>
    ${e.sets.map((s,j)=>{const ph=placeholderFor(e,j);const label=s.type==='w'?'Р':++wn;const p=prevW[wn-1];
      return `<div class="srow ${one?'one':''} ${s.done?'isdone':''}" data-i="${i}" data-j="${j}">
        <button class="setn ${s.type==='w'?'w':''}" data-act="set-type" data-i="${i}" data-j="${j}" aria-label="Тип подхода">${label}</button>
        <span class="prev num">${s.pr?'<span class="prmark">РЕКОРД</span>':(s.type!=='w'&&p?setText(x.t,p):'—')}</span>
        <input class="sin" data-in="set" data-f="a" data-i="${i}" data-j="${j}" inputmode="decimal" value="${esc(s.a)}" placeholder="${esc(ph.a)}" aria-label="${T.f[0]}">
        ${one?'':`<input class="sin" data-in="set" data-f="b" data-i="${i}" data-j="${j}" inputmode="${x.t==='c'?'decimal':'numeric'}" value="${esc(s.b)}" placeholder="${esc(ph.b)}" aria-label="${T.f[1]}">`}
        <button class="chk ${justDone&&justDone.i===i&&justDone.j===j?'pop':''}" data-act="set-done" data-i="${i}" data-j="${j}" aria-label="Подход выполнен">${ICON.check}</button></div>`}).join('')}
    </div><button class="addset" data-act="set-add" data-i="${i}">Добавить подход</button></div>`;
}
function toggleDone(i,j){
  const e=active.ex[i],s=e.sets[j],x=exById(e.exId);
  if(s.done){s.done=false;s.pr=false;saveActive();renderWorkout(true);return}
  const ph=placeholderFor(e,j);
  const va=s.a!==''?s.a:String(ph.a),vb=s.b!==''?s.b:String(ph.b);
  const a=num(va),b=num(vb);
  if(x.t==='w'&&(!b||a==null)){toast('Впиши вес и повторения');return}
  if(x.t==='bw'&&!b){toast('Впиши количество повторений');return}
  if((x.t==='t'||x.t==='c')&&!a){toast(x.t==='t'?'Впиши время в секундах':'Впиши минуты');return}
  s.a=va;if(TYPES[x.t].f.length>1)s.b=vb;
  s.done=true;s.at=Date.now();justDone={i,j};setTimeout(()=>{justDone=null},400);
  if(isWork(s)){
    const hist=bestEver(e.exId,active.id);
    const cur=setScore(x.t,s);
    const inWorkout=Math.max(0,...active.ex.filter(q=>q.exId===e.exId).flatMap(q=>q.sets.filter(z=>z!==s&&z.done&&isWork(z)).map(z=>setScore(x.t,z))));
    if(hist>0&&cur>hist&&cur>inWorkout){active.ex.forEach(q=>q.exId===e.exId&&q.sets.forEach(z=>z.pr=false));s.pr=true;
      toast(x.t==='w'?`Новый рекорд! Расчётный максимум ${fmt(cur)} кг`:'Новый рекорд!',true);buzz([60,40,60]);confetti(70)}
  }
  saveActive();renderWorkout(true);
  startRest(e.rest||state.settings.rest);
}
function finishWorkout(){
  const doneCount=active.ex.reduce((t,e)=>t+e.sets.filter(s=>s.done).length,0);
  if(!doneCount){askConfirm('Ни один подход не отмечен. Тренировка не сохранится. Отменить её?','Отменить тренировку',cancelWorkout);return}
  const undone=active.ex.reduce((t,e)=>t+e.sets.filter(s=>!s.done).length,0);
  const go=()=>{
    const w=clone(active);w.end=Date.now();
    w.ex=w.ex.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
    history.unshift(w);saveHistory();writeWorkout(w);
    active=null;saveActive();stopRest();sheets.length=0;hideWorkout();unwake();
    showSummary(w);
  };
  if(undone)askConfirm(`${undone} ${plural(undone,'подход не отмечен','подхода не отмечены','подходов не отмечены')} и не попадут в историю. Завершить?`,'Завершить',go,false);
  else go();
}

let rest=null; // {end,total,over}
let actx=null;
function startRest(sec){if(!sec)return;rest={end:Date.now()+sec*1000,total:sec*1000,over:false};renderRest()}
function stopRest(){rest=null;renderRest()}
function nextUp(){
  if(!active)return '';
  for(const e of active.ex){const j=e.sets.findIndex(z=>!z.done);if(j>=0){const x=exById(e.exId),ph=placeholderFor(e,j),z=e.sets[j];
    const v={a:z.a!==''?z.a:ph.a,b:z.b!==''?z.b:ph.b};const has=v.a!==''||v.b!=='';
    return `Дальше: ${x.n}, подход ${j+1}${has?`, ${setText(x.t,v)}`:''}`}}

}
function renderRest(){
  const host=$('#rest');
  if(!rest){host.innerHTML='';return}
  const btns=rest.over?`<button class="rbtn" data-act="rest-skip">OK</button>`:`<button class="rbtn" data-act="rest-minus">−15</button><button class="rbtn" data-act="rest-plus">+15</button><button class="rbtn" data-act="rest-skip" aria-label="Пропустить">${ICON.close.replace('<svg','<svg width="16" height="16"')}</button>`;

    host.innerHTML=`<div class="restbig ${rest.over?'over':''}"><button class="min" data-act="rest-big" aria-label="Свернуть">${ICON.down.replace('<svg','<svg width="22" height="22"')}</button>

      <circle id="restArc" cx="130" cy="130" r="120" fill="none" stroke="${rest.over?'#fff':'var(--red)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}"/></svg>
      <div class="bt"><div class="rest-t num disp" id="restT"></div><div class="rest-l">${rest.over?'Пора за следующий подход':'Отдых'}</div></div></div>
      <div class="nextup">${esc(nextUp())}</div><div class="row">${btns}</div></div>`;
  }else{
    const C=2*Math.PI*24;
    host.innerHTML=`<div class="rest ${woOpen?'':'lift'} ${rest.over?'over':''}"><div class="rest-in">
    <button class="ring" data-act="rest-big" aria-label="Развернуть таймер"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="rgba(127,127,127,.3)" stroke-width="5"/>
      <circle id="restArc" cx="28" cy="28" r="24" fill="none" stroke="${rest.over?'#fff':'var(--red)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><span class="rt">${ICON.expand.replace('<svg','<svg width="16" height="16"')}</span></button>
    <button class="grow" style="text-align:left" data-act="rest-big"><div class="rest-t num" id="restT"></div><div class="rest-l">${rest.over?'Отдых окончен, следующий подход':esc(nextUp())}</div></button>
    ${btns}</div></div>`;
  }
  updateRest();
}
function updateRest(){
  if(!rest)return;
  const left=rest.end-Date.now();
  if(left<=0&&!rest.over){rest.over=true;restDone();const r0=rest;setTimeout(()=>{if(rest===r0)stopRest()},6000);renderRest();return}
  const arc=document.getElementById('restArc'),tx=document.getElementById('restT');
  if(arc){const C=2*Math.PI*(+arc.getAttribute('r')),frac=rest.over?1:Math.max(0,Math.min(1,left/rest.total));arc.setAttribute('stroke-dashoffset',C*(1-frac))}
  if(tx)tx.textContent=rest.over?'Пора!':fmtDur(left+999);
}
function beep(){
  if(!state.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [0,.22,.44].forEach((t,k)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=k===2?1180:880;o.type='sine';
      g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);
      o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}
}
function buzz(p){if(state.settings.vibe&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

function waterAdd(ml,day){
  day=day||dkey();const before=waterDay(day),g=habits.water.goal;
  habits.water.days[day]=before+ml;(habits.water.entries[day]=habits.water.entries[day]||[]).push([day===dkey()?Date.now():keyDate(day).getTime(),ml]);
  saveHabits();buzz(25);
  if(before<g&&before+ml>=g){toast('Норма воды на день выполнена',true);confetti(80)}
}

let sw=null;
document.addEventListener('touchstart',e=>{const r=e.target.closest('.srow[data-i]');if(!r||e.target.closest('input'))return;sw={r,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,h:false}},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;
  if(!sw.h){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)>10)sw.h=true}
  if(sw.h){sw.dx=Math.min(0,dx);sw.r.classList.add('swiping');sw.r.style.transform=`translateX(${sw.dx}px)`;sw.r.style.background=sw.dx<-90?'color-mix(in srgb,var(--red) 25%,transparent)':''}},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const {r,dx}=sw;sw=null;r.classList.remove('swiping');
  if(dx<-90&&active){const i=+r.dataset.i,j=+r.dataset.j,e=active.ex[i];const [s0]=e.sets.splice(j,1);saveActive();renderWorkout(true);buzz(20);
    toast('Подход удалён',false,()=>{e.sets.splice(j,0,s0);saveActive();renderWorkout(true)})}
  else{r.style.transform='';r.style.background=''}});

};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='set'){active.ex[+t.dataset.i].sets[+t.dataset.j][t.dataset.f]=t.value;saveActive();return}
  if(k==='wo-name'){active.name=t.value;saveActive();return}
  if(k==='ex-note'){active.ex[+t.dataset.i].note=t.value;saveActive();return}
  if(k==='sx-name'||k==='sx-dose'){topSheet().data[k==='sx-name'?'name':'dose']=t.value;return}
  if(k==='lib-q'){libQuery=t.value;$('#libList').innerHTML=exListHtml(filterEx(libQuery,libGroup));return}
  if(k==='pick-q'){const s=topSheet();s.q=t.value;$('#pickList').innerHTML=exListHtml(filterEx(s.q,s.g),true,s.pick);return}
  if(k==='tpl-name'){topSheet().tpl.name=t.value;return}
  if(k==='wc-v'){topSheet().v=t.value;return}
  if(k==='auth-email'){topSheet().email=t.value;return}
  if(k==='auth-pass'){topSheet().pass=t.value;return}
  if(k==='tpl-sets'){const v=parseInt(t.value);if(v>0&&v<20)topSheet().tpl.ex[+t.dataset.j].sets=v;return}
  if(k==='tpl-reps'){const v=parseInt(t.value);topSheet().tpl.ex[+t.dataset.j].reps=v>0?v:null;return}
  if(k==='plates-w'){const s=topSheet();s.w=t.value;const tmp=document.createElement('div');tmp.innerHTML=s.render();$('#platesOut').innerHTML=tmp.querySelector('#platesOut').innerHTML;return}
  if(k==='orm-w'||k==='orm-r'){const s=topSheet();s[k==='orm-w'?'w':'r']=t.value;const tmp=document.createElement('div');tmp.innerHTML=s.render();$('#ormOut').innerHTML=tmp.querySelector('#ormOut').innerHTML;return}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;
  if(k==='prog-ex'){progEx=t.value;render()}
  if(k==='import'){const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(d.app!=='podhod')throw 0;
      state={...state,...d.state,settings:{...DEF_SETTINGS,...(d.state.settings||{})}};if(d.habits){habits=mergeHab(d.habits);saveHabits()}const ids=new Set(history.map(w=>w.id));const add=(d.history||[]).filter(w=>!ids.has(w.id));
      history=[...history,...add];saveState();saveHistory();for(const w of add)await writeWorkout(w);sheets.length=0;drawSheets();render();toast(`Загружено тренировок: ${add.length}`)}catch(err){toast('Это не файл копии «Подхода»')}};r.readAsText(f)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheets.length)closeSheet();
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('sin')){e.target.blur()}
  if(e.key==='Enter'&&e.target.dataset&&(e.target.dataset.in==='auth-pass'||e.target.dataset.in==='auth-email')){const s=topSheet();if(s&&s.auth)A[s.mode?'auth-go':'auth-newpass']()}
});

/* ===================== tick ===================== */
setInterval(()=>{
  if(active){const v=fmtDur(Date.now()-active.start);document.querySelectorAll('[data-live="elapsed"]').forEach(n=>n.textContent=v)}
  if(rest)updateRest();
},250);

loadLocal();render();
initAuth();
</script>
